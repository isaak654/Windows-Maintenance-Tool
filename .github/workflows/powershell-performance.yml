name: PowerShell performance analysis

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path or file name of the PowerShell script to profile"
        required: true
        default: "./WMT-GUI.ps1"
        type: string

      fail_threshold_seconds:
        description: "Fail if total execution time exceeds this value. Use 0 to disable."
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  performance-analysis:
    name: Profile PowerShell script
    runs-on: windows-latest

    env:
      SCRIPT_PATH: ${{ inputs.script_path }}
      FAIL_THRESHOLD_SECONDS: ${{ inputs.fail_threshold_seconds }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PowerShell Profiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-PSRepository `
            -Name PSGallery `
            -InstallationPolicy Trusted

          Install-Module `
            -Name Profiler `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

      - name: Locate target script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $resultsDirectory = Join-Path `
            -Path (Get-Location) `
            -ChildPath "profiler-results"

          New-Item `
            -ItemType Directory `
            -Path $resultsDirectory `
            -Force |
            Out-Null

          $requestedPath = $env:SCRIPT_PATH

          if ([System.IO.Path]::IsPathRooted($requestedPath)) {
              $candidatePath = $requestedPath
          }
          else {
              $candidatePath = Join-Path `
                -Path (Get-Location) `
                -ChildPath $requestedPath
          }

          $resolvedScriptPath = $null

          if (Test-Path -LiteralPath $candidatePath -PathType Leaf) {
              $resolvedScriptPath = (Resolve-Path -LiteralPath $candidatePath).Path
          }
          else {
              $requestedName = [System.IO.Path]::GetFileName($requestedPath)

              $matches = @(
                  Get-ChildItem `
                    -Path (Get-Location) `
                    -Recurse `
                    -File `
                    -Filter $requestedName |
                  Where-Object {
                      $_.FullName -notmatch '[\\/]\.git[\\/]'
                  }
              )

              if ($matches.Count -eq 1) {
                  $resolvedScriptPath = $matches[0].FullName
              }
              elseif ($matches.Count -gt 1) {
                  Write-Host "Multiple matching PowerShell scripts were found:"
                  $matches |
                    Select-Object -ExpandProperty FullName

                  throw "More than one script named '$requestedName' was found."
              }
          }

          if ([string]::IsNullOrWhiteSpace($resolvedScriptPath)) {
              Write-Host "Available PowerShell scripts:"

              Get-ChildItem `
                -Path (Get-Location) `
                -Recurse `
                -File `
                -Filter "*.ps1" |
              Where-Object {
                  $_.FullName -notmatch '[\\/]\.git[\\/]'
              } |
              Select-Object -ExpandProperty FullName

              throw "PowerShell script not found: $requestedPath"
          }

          if (
              [System.IO.Path]::GetExtension($resolvedScriptPath) `
              -ine ".ps1"
          ) {
              throw "The selected file must have a .ps1 extension."
          }

          Write-Host "Target script: $resolvedScriptPath"

          "RESOLVED_SCRIPT_PATH=$resolvedScriptPath" |
            Add-Content `
              -Path $env:GITHUB_ENV `
              -Encoding utf8

      - name: Validate target script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = $env:RESOLVED_SCRIPT_PATH

          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw "Resolved PowerShell script not found: $scriptPath"
          }

          try {
              & $scriptPath
          }
          catch {
              $errorMessage = $_ | Out-String

              $errorMessage |
                Set-Content `
                  -Path "profiler-results/preflight-error.txt" `
                  -Encoding utf8

              throw "The target script failed during validation.`n$errorMessage"
          }

      - name: Run PowerShell profiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = $env:RESOLVED_SCRIPT_PATH

          $exportDirectory = Join-Path `
            -Path (Get-Location) `
            -ChildPath "profiler-results"

          $exportBasePath = Join-Path `
            -Path $exportDirectory `
            -ChildPath "profile"

          Import-Module `
            -Name Profiler `
            -ErrorAction Stop

          try {
              Write-Host "Profiling script: $scriptPath"

              $trace = Trace-Script `
                -ScriptBlock {
                    $ErrorActionPreference = "Stop"
                    & $scriptPath
                } `
                -Preheat 1 `
                -ExportPath $exportBasePath

              if ($null -eq $trace) {
                  throw "The profiler did not return any result."
              }

              $trace |
                Export-Clixml `
                  -Path (Join-Path $exportDirectory "trace.clixml") `
                  -Depth 20

              @(
                  $trace.Top50SelfDuration |
                    Select-Object `
                      File,
                      Line,
                      Text,
                      SelfDuration,
                      SelfPercent
              ) |
                ConvertTo-Json `
                  -Depth 10 |
                Set-Content `
                  -Path (Join-Path $exportDirectory "top-self-duration.json") `
                  -Encoding utf8

              @(
                  $trace.Top50Duration |
                    Select-Object `
                      File,
                      Line,
                      Text,
                      Duration,
                      Percent
              ) |
                ConvertTo-Json `
                  -Depth 10 |
                Set-Content `
                  -Path (Join-Path $exportDirectory "top-duration.json") `
                  -Encoding utf8

              $totalSeconds = [double]$trace.TotalDuration.TotalSeconds

              $topOperations = @(
                  $trace.Top50SelfDuration |
                    Select-Object -First 20 `
                      File,
                      Line,
                      Text,
                      SelfDuration,
                      SelfPercent |
                    Format-Table -AutoSize |
                    Out-String
              ) -join ""

              $summary = @(
                  "## PowerShell performance report"
                  ""
                  "**Script:** $($env:SCRIPT_PATH)  "
                  "**Resolved path:** $scriptPath  "
                  "**Total duration:** $($trace.TotalDuration)  "
                  "**Total seconds:** $totalSeconds"
                  ""
                  "### Slowest lines by self duration"
                  ""
                  '```text'
                  \$topOperations
                  '```'
              )

              $summary -join "`n" |
                Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8

              $threshold = 0.0

              if (-not [double]::TryParse(
                  $env:FAIL_THRESHOLD_SECONDS,
                  [Globalization.NumberStyles]::Float,
                  [Globalization.CultureInfo]::InvariantCulture,
                  [ref]$threshold
              )) {
                  throw "FAIL_THRESHOLD_SECONDS must be a valid number."
              }

              if ($threshold -gt 0 -and $totalSeconds -gt $threshold) {
                  throw `
                    "Performance threshold exceeded. " +
                    "Actual: $totalSeconds seconds. " +
                    "Allowed: $threshold seconds."
              }

              Write-Host "Profiling completed successfully."
              Write-Host "Total duration: $totalSeconds seconds."
          }
          catch {
              $_ |
                Out-String |
                Set-Content `
                  -Path (Join-Path $exportDirectory "profiler-error.txt") `
                  -Encoding utf8

              throw
          }

      - name: List profiler output files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "profiler-results") {
              Get-ChildItem `
                -Path "profiler-results" `
                -Recurse `
                -Force
          }
          else {
              Write-Warning "The profiler-results directory does not exist."
          }

      - name: Upload profiler results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: powershell-profiler-results
          path: profiler-results
          if-no-files-found: warn
          retention-days: 14
