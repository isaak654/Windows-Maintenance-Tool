name: PowerShell performance analysis

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: "Path of the PowerShell script to profile"
        required: true
        default: "./Windows-Maintenance-Tool.ps1"
        type: string

      fail_threshold_seconds:
        description: "Fail if total execution time exceeds this value. Use 0 to disable."
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  performance-analysis:
    name: Profile PowerShell script
    runs-on: windows-latest

    env:
      SCRIPT_PATH: ${{ inputs.script_path }}
      FAIL_THRESHOLD_SECONDS: ${{ inputs.fail_threshold_seconds }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PowerShell Profiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-PSRepository `
            -Name PSGallery `
            -InstallationPolicy Trusted

          Install-Module `
            -Name Profiler `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

      - name: Validate target script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Path "profiler-results" `
            -Force | Out-Null

          $scriptPath = Join-Path `
            -Path $PWD `
            -ChildPath $env:SCRIPT_PATH

          if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw "PowerShell script not found: $scriptPath"
          }

          if ([System.IO.Path]::GetExtension($scriptPath) -ne ".ps1") {
              throw "The selected file must have a .ps1 extension."
          }

          Write-Host "Target script: $scriptPath"

      - name: Run PowerShell profiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = Join-Path `
            -Path $PWD `
            -ChildPath $env:SCRIPT_PATH

          $scriptPath = (Resolve-Path -LiteralPath $scriptPath).Path

          $exportDirectory = Join-Path `
            -Path $PWD `
            -ChildPath "profiler-results"

          New-Item `
            -ItemType Directory `
            -Path $exportDirectory `
            -Force | Out-Null

          # ExportPath is a file base path, not a directory.
          # Profiler appends ".speedscope.json" automatically.
          $exportBasePath = Join-Path `
            -Path $exportDirectory `
            -ChildPath "profile"

          Import-Module Profiler

          try {
              Write-Host "Profiling script: $scriptPath"

              $trace = Trace-Script `
                -ScriptBlock {
                    & $scriptPath
                } `
                -Preheat 1 `
                -ExportPath $exportBasePath

              if ($null -eq $trace) {
                  throw "The profiler did not return any result."
              }

              $trace |
                ConvertTo-Json -Depth 20 |
                Set-Content `
                  -Path (Join-Path $exportDirectory "trace.json") `
                  -Encoding UTF8

              $trace.Top50SelfDuration |
                Select-Object `
                  File,
                  Line,
                  Text,
                  SelfDuration,
                  SelfPercent |
                ConvertTo-Json -Depth 10 |
                Set-Content `
                  -Path (Join-Path $exportDirectory "top-self-duration.json") `
                  -Encoding UTF8

              $trace.Top50Duration |
                Select-Object `
                  File,
                  Line,
                  Text,
                  Duration,
                  Percent |
                ConvertTo-Json -Depth 10 |
                Set-Content `
                  -Path (Join-Path $exportDirectory "top-duration.json") `
                  -Encoding UTF8

              $totalSeconds = $trace.TotalDuration.TotalSeconds

              @"
          ## PowerShell performance report

          **Script:** ``$env:SCRIPT_PATH``  
          **Total duration:** ``$($trace.TotalDuration)``  
          **Total seconds:** ``$totalSeconds``

          ### Slowest lines by self duration

          ```\`text
          \$(
              \$trace.Top50SelfDuration |
                  Select-Object -First 20 \`
                    File,
                    Line,
                    Text,
                    SelfDuration,
                    SelfPercent |
                  Format-Table -AutoSize |
                  Out-String
          )
          ````
          "@ | Out-File `
                -FilePath $env:GITHUB_STEP_SUMMARY `
                -Encoding utf8

              $threshold = [double]$env:FAIL_THRESHOLD_SECONDS

              if ($threshold -gt 0 -and $totalSeconds -gt $threshold) {
                  throw "Performance threshold exceeded. Actual: $totalSeconds seconds. Allowed: $threshold seconds."
              }

              Write-Host "Profiling completed successfully."
          }
          catch {
              $_ | Out-String |
                Set-Content `
                  -Path (Join-Path $exportDirectory "profiler-error.txt") `
                  -Encoding UTF8

              throw
          }

      - name: List profiler output files
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "profiler-results") {
              Get-ChildItem `
                -Path "profiler-results" `
                -Recurse `
                -Force
          }
          else {
              Write-Warning "The profiler-results directory does not exist."
          }

      - name: Upload profiler results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: powershell-profiler-results
          path: profiler-results
          if-no-files-found: warn
          retention-days: 14
