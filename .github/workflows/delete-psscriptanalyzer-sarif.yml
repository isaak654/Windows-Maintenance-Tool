name: Delete PSScriptAnalyzer SARIF analyses

on:
  workflow_dispatch:
    inputs:
      tool_name:
        description: "Name of the Code Scanning tool"
        required: true
        default: "PSScriptAnalyzer"
        type: string

      dry_run:
        description: "Only list deletable analyses without deleting them"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  delete-sarif-analyses:
    name: Delete SARIF analyses
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TOOL_NAME: ${{ inputs.tool_name }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: List matching Code Scanning analyses
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository: ${GH_REPO}"
          echo "Tool: ${TOOL_NAME}"
          echo "Dry run: ${DRY_RUN}"
          echo

          gh api \
            --paginate \
            "repos/${GH_REPO}/code-scanning/analyses?per_page=100" \
            --jq '
              .[]
              | select(.tool.name == env.TOOL_NAME)
              | [
                  .id,
                  .ref,
                  .category,
                  .deletable,
                  .created_at
                ]
              | @tsv
            ' || true

      - name: Delete matching Code Scanning analyses
        if: ${{ inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ANALYSIS_IDS < <(
            gh api \
              --paginate \
              "repos/${GH_REPO}/code-scanning/analyses?per_page=100" \
              --jq '
                .[]
                | select(
                    .tool.name == env.TOOL_NAME
                    and .deletable == true
                  )
                | .id
              '
          )

          if [[ ${#ANALYSIS_IDS[@]} -eq 0 ]]; then
            echo "No deletable analyses found for tool: ${TOOL_NAME}"
            exit 0
          fi

          echo "Found ${#ANALYSIS_IDS[@]} deletable analysis/analyses."
          echo

          for ANALYSIS_ID in "${ANALYSIS_IDS[@]}"; do
            echo "Deleting Code Scanning analysis: ${ANALYSIS_ID}"

            if RESPONSE="$(
              gh api \
                --method DELETE \
                "repos/${GH_REPO}/code-scanning/analyses/${ANALYSIS_ID}?confirm_delete=true" \
                2>&1
            )"; then
              echo "Analysis deleted successfully."
            else
              if grep -q "HTTP 404" <<< "${RESPONSE}"; then
                echo "Analysis ${ANALYSIS_ID} was already deleted or is no longer available."
              else
                echo "${RESPONSE}"
                exit 1
              fi
            fi

            echo
          done

          echo "Deletion process completed."
