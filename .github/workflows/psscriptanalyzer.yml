name: PowerShell - PSScriptAnalyzer

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '**.ps1'
      - '.github/workflows/psscriptanalyzer.yml'

  pull_request:
    paths:
      - '**.ps1'
      - '.github/workflows/psscriptanalyzer.yml'

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: psscriptanalyzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze PowerShell code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install latest PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository `
            -Name PSGallery `
            -InstallationPolicy Trusted

          # Resolve the latest version published on PowerShell Gallery.
          $latest = Find-Module `
            -Name PSScriptAnalyzer `
            -Repository PSGallery `
            -ErrorAction Stop

          Write-Host "Latest PSScriptAnalyzer version: $($latest.Version)"

          # Install the resolved version for the current user.
          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion $latest.Version `
            -Scope CurrentUser `
            -Repository PSGallery `
            -Force `
            -AllowClobber `
            -ErrorAction Stop

          # Verify that the expected module version is available.
          Import-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion $latest.Version `
            -Force `
            -ErrorAction Stop

          $installed = Get-Module -Name PSScriptAnalyzer

          Write-Host "Installed PSScriptAnalyzer version: $($installed.Version)"

      - name: Run PSScriptAnalyzer and generate SARIF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module `
            -Name PSScriptAnalyzer `
            -Force `
            -ErrorAction Stop

          $extensions = @(
            '*.ps1'
            '*.psm1'
            '*.psd1'
          )

          $files = foreach ($extension in $extensions) {
            Get-ChildItem `
              -Path $PWD `
              -Filter $extension `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '[/\\](\.git|node_modules|bin|obj|vendor)[/\\]'
              }
          }

          $files = @(
            $files |
              Sort-Object -Property FullName -Unique
          )

          if ($files.Count -eq 0) {
            Write-Warning 'No PowerShell files were found.'

            @{
              '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
              version   = '2.1.0'
              runs      = @(
                @{
                  tool = @{
                    driver = @{
                      name  = 'PSScriptAnalyzer'
                      rules = @()
                    }
                  }
                  results = @()
                }
              )
            } |
              ConvertTo-Json -Depth 20 |
              Set-Content `
                -Path PSScriptAnalyzer-results.sarif `
                -Encoding utf8

            exit 0
          }

          Write-Host "Files to analyze: $($files.Count)"

          $settingsPath = Join-Path `
            -Path $PWD `
            -ChildPath 'PSScriptAnalyzerSettings.psd1'

          $issues = foreach ($file in $files) {
            Write-Host "Analyzing: $($file.FullName)"

            $parameters = @{
              Path        = $file.FullName
              ErrorAction = 'Stop'
            }

            if (Test-Path -LiteralPath $settingsPath) {
              $parameters.Settings = $settingsPath
            }

            Invoke-ScriptAnalyzer @parameters
          }

          $issues = @($issues)

          # Save all findings, including warnings and information messages.
          $issues |
            ConvertTo-Json -Depth 8 |
            Set-Content `
              -Path PSScriptAnalyzer-results.json `
              -Encoding utf8

          $errors = @(
            $issues |
              Where-Object {
                $_.Severity -eq 'Error' -or
                $_.Severity -eq 'ParseError'
              }
          )

          $warnings = @(
            $issues |
              Where-Object Severity -eq 'Warning'
          )

          $information = @(
            $issues |
              Where-Object Severity -eq 'Information'
          )

          Write-Host ''
          Write-Host "Errors:       $($errors.Count)"
          Write-Host "Warnings:     $($warnings.Count)"
          Write-Host "Information:  $($information.Count)"

          # Print all findings to the workflow log.
          if ($issues.Count -gt 0) {
            Write-Host ''
            Write-Host 'PSScriptAnalyzer findings:'

            $issues |
              Sort-Object ScriptName, Line, Column |
              Format-Table `
                Severity,
                RuleName,
                ScriptName,
                Line,
                Column,
                Message `
                -AutoSize
          }

          # Include only errors and parse errors in the SARIF report.
          $sarifIssues = @(
            $issues |
              Where-Object {
                $_.Severity -eq 'Error' -or
                $_.Severity -eq 'ParseError'
              }
          )

          $rules = @{}
          $sarifResults = @()

          foreach ($issue in $sarifIssues) {
            $ruleId = if ($issue.RuleName) {
              [string]$issue.RuleName
            }
            else {
              'PSScriptAnalyzer'
            }

            if (-not $rules.ContainsKey($ruleId)) {
              $rules[$ruleId] = @{
                id               = $ruleId
                name             = $ruleId
                shortDescription = @{
                  text = $ruleId
                }
                fullDescription  = @{
                  text = "PSScriptAnalyzer rule $ruleId"
                }
              }
            }

            $scriptPath = if ($issue.ScriptName) {
              [string]$issue.ScriptName
            }
            else {
              [string]$files[0].FullName
            }

            if ([System.IO.Path]::IsPathRooted($scriptPath)) {
              $relativePath = [System.IO.Path]::GetRelativePath(
                $PWD.Path,
                $scriptPath
              )
            }
            else {
              $relativePath = $scriptPath
            }

            $relativePath = $relativePath.Replace('\', '/')

            $startLine = if ($issue.Line) {
              [int]$issue.Line
            }
            else {
              1
            }

            $startColumn = if ($issue.Column) {
              [int]$issue.Column
            }
            else {
              1
            }

            # Use only the starting position to avoid oversized code previews.
            $sarifResults += @{
              ruleId  = $ruleId
              level   = 'error'
              message = @{
                text = [string]$issue.Message
              }
              locations = @(
                @{
                  physicalLocation = @{
                    artifactLocation = @{
                      uri = $relativePath
                    }
                    region = @{
                      startLine   = $startLine
                      startColumn = $startColumn
                    }
                  }
                }
              )
            }
          }

          $sarif = @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version   = '2.1.0'
            runs      = @(
              @{
                tool = @{
                  driver = @{
                    name           = 'PSScriptAnalyzer'
                    informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'
                    rules          = @($rules.Values)
                  }
                }
                results = @($sarifResults)
              }
            )
          }

          $sarif |
            ConvertTo-Json -Depth 20 |
            Set-Content `
              -Path PSScriptAnalyzer-results.sarif `
              -Encoding utf8

          # Fail the workflow only when errors are detected.
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer detected $($errors.Count) error(s)."
          }

      - name: Upload SARIF results to GitHub Code Scanning
        if: always() && hashFiles('PSScriptAnalyzer-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: PSScriptAnalyzer-results.sarif
          category: psscriptanalyzer

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psscriptanalyzer-results
          path: |
            PSScriptAnalyzer-results.sarif
            PSScriptAnalyzer-results.json
          if-no-files-found: ignore
          retention-days: 30
