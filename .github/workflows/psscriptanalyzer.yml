name: PowerShell - PSScriptAnalyzer

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '**.ps1'
      - '.github/workflows/psscriptanalyzer.yml'

  pull_request:
    paths:
      - '**.ps1'
      - '.github/workflows/psscriptanalyzer.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psscriptanalyzer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze PowerShell code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install latest PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-PSRepository `
            -Name PSGallery `
            -InstallationPolicy Trusted

          # Resolve the latest version published on PowerShell Gallery.
          $latest = Find-Module `
            -Name PSScriptAnalyzer `
            -Repository PSGallery `
            -ErrorAction Stop

          Write-Host "Latest PSScriptAnalyzer version: $($latest.Version)"

          # Install the resolved version for the current user.
          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion $latest.Version `
            -Scope CurrentUser `
            -Repository PSGallery `
            -Force `
            -AllowClobber `
            -ErrorAction Stop

          # Verify that the expected module version is available.
          Import-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion $latest.Version `
            -Force `
            -ErrorAction Stop

          $installed = Get-Module -Name PSScriptAnalyzer

          Write-Host "Installed PSScriptAnalyzer version: $($installed.Version)"

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module `
            -Name PSScriptAnalyzer `
            -Force `
            -ErrorAction Stop

          $extensions = @(
            '*.ps1'
            '*.psm1'
            '*.psd1'
          )

          $files = foreach ($extension in $extensions) {
            Get-ChildItem `
              -Path $PWD `
              -Filter $extension `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -notmatch '[/\\](\.git|node_modules|bin|obj|vendor)[/\\]'
              }
          }

          $files = @(
            $files |
              Sort-Object -Property FullName -Unique
          )

          if ($files.Count -eq 0) {
            Write-Warning 'No PowerShell files were found.'
            exit 0
          }

          Write-Host "Files to analyze: $($files.Count)"

          $settingsPath = Join-Path `
            -Path $PWD `
            -ChildPath 'PSScriptAnalyzerSettings.psd1'

          $issues = foreach ($file in $files) {
            Write-Host "Analyzing: $($file.FullName)"

            $parameters = @{
              Path        = $file.FullName
              ErrorAction = 'Stop'
            }

            if (Test-Path -LiteralPath $settingsPath) {
              $parameters.Settings = $settingsPath
            }

            Invoke-ScriptAnalyzer @parameters
          }

          $issues = @($issues)

          $issues |
            ConvertTo-Json -Depth 8 |
            Set-Content `
              -Path PSScriptAnalyzer-results.json `
              -Encoding utf8

          $errors = @(
            $issues |
              Where-Object Severity -eq 'Error'
          )

          $warnings = @(
            $issues |
              Where-Object Severity -eq 'Warning'
          )

          $information = @(
            $issues |
              Where-Object Severity -eq 'Information'
          )

          Write-Host ''
          Write-Host "Errors:       $($errors.Count)"
          Write-Host "Warnings:     $($warnings.Count)"
          Write-Host "Information:  $($information.Count)"

          if ($issues.Count -gt 0) {
            Write-Host ''
            Write-Host 'PSScriptAnalyzer findings:'

            $issues |
              Sort-Object ScriptName, Line, Column |
              Format-Table `
                Severity,
                RuleName,
                ScriptName,
                Line,
                Column,
                Message `
                -AutoSize
          }

          # Fail the workflow only when errors are detected.
          if ($errors.Count -gt 0) {
            throw "PSScriptAnalyzer detected $($errors.Count) error(s)."
          }

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psscriptanalyzer-results
          path: PSScriptAnalyzer-results.json
          if-no-files-found: ignore
          retention-days: 30
